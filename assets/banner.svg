<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="ML Classics Level 2 Boosting banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16110d"/>
      <stop offset="0.6" stop-color="#2a1d14"/>
      <stop offset="1" stop-color="#5a3216"/>
    </linearGradient>
    <linearGradient id="stair" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <!-- decorative boosting stairs: each step adds a correction on top of the previous one -->
  <g transform="translate(850 40)">
    <rect x="0"   y="170" width="56" height="50"  rx="6" fill="url(#stair)"/>
    <rect x="68"  y="140" width="56" height="80"  rx="6" fill="url(#stair)"/>
    <rect x="68"  y="118" width="56" height="22"  rx="6" fill="#ff4d8d"/>
    <rect x="136" y="100" width="56" height="120" rx="6" fill="url(#stair)"/>
    <rect x="136" y="78"  width="56" height="22"  rx="6" fill="#ff4d8d"/>
    <rect x="204" y="62"  width="56" height="158" rx="6" fill="url(#stair)"/>
    <rect x="204" y="44"  width="56" height="18"  rx="6" fill="#ff4d8d"/>
    <rect x="272" y="30"  width="56" height="190" rx="6" fill="url(#stair)"/>
    <rect x="272" y="16"  width="56" height="14"  rx="6" fill="#ff4d8d"/>
    <line x1="-10" y1="222" x2="350" y2="222" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <text x="0" y="254" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#f0d9b5">weak learner  +  correction  +  correction ...</text>
  </g>
  <!-- title -->
  <text x="64" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#ffb000" letter-spacing="6">ML CLASSICS · LEVEL 2</text>
  <text x="62" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Gradient Boosting</text>
  <text x="64" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#f0d9b5">XGBoost  ·  LightGBM  ·  CatBoost</text>
</svg>
